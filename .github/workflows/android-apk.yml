name: Build حال خوب Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "style.css"
      - "app.js"
      - "features.js"
      - "ai-config.js"
      - "manifest.webmanifest"
      - "sw.js"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: haal-khoob-android
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Android installer
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools were not found on this runner."
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web bundle
        run: npm run build:mobile

      - name: Generate native Android project
        run: npx cap add android

      - name: Apply the original Haal Khoob app icon
        run: node scripts/apply-android-icons.mjs

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build installable debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Package APK for phone transfer
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/haal-khoob.apk
          cat > dist/راهنمای-نصب.txt <<'EOF'
          نصب حال خوب روی گوشی اندروید

          1) فایل ZIP را استخراج کنید.
          2) فایل haal-khoob.apk را به گوشی اندرویدی منتقل کنید.
          3) فایل APK را در گوشی باز کنید.
          4) اگر اندروید اجازه خواست، برای برنامه Files یا مرورگری که فایل را باز کرده، گزینه Install unknown apps / Allow from this source را فعال کنید.
          5) دوباره APK را باز و Install را انتخاب کنید.

          این نسخه برای نصب مستقیم و آزمایش شخصی با امضای Debug ساخته شده است.
          برای نصب نسخه جدید با امضای متفاوت، ممکن است لازم باشد نسخه قبلی را حذف کنید.
          EOF
          cd dist
          zip -q haal-khoob-android-install.zip haal-khoob.apk راهنمای-نصب.txt

      - name: Upload downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: haal-khoob-android-install
          path: |
            dist/haal-khoob.apk
            dist/haal-khoob-android-install.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK and ZIP on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: حال خوب · نسخه اندروید ${{ github.run_number }}
          target_commitish: main
          files: |
            dist/haal-khoob.apk
            dist/haal-khoob-android-install.zip
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
